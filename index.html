const S=240,SEG=190,lerp=(a,b,t)=>a+(b-a)*t,sm=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};

const PRAD=.4;function collide(){const p=P.position;for(const o of COL){if(o.hw){const cx=Math.max(o.x-o.hw,Math.min(o.x+o.hw,p.x)),cz=Math.max(o.z-o.hw,Math.min(o.z+o.hw,p.z)),dx=p.x-cx,dz=p.z-cz,d=Math.hypot(dx,dz);if(d>1e-4){if(d<PRAD){p.x+=dx/d*(PRAD-d);p.z+=dz/d*(PRAD-d)}}else{const ex=o.hw-Math.abs(p.x-o.x),ez=o.hw-Math.abs(p.z-o.z);if(ex<ez)p.x+=(p.x<o.x?-1:1)*(ex+PRAD);else p.z+=(p.z<o.z?-1:1)*(ez+PRAD)}}else{const dx=p.x-o.x,dz=p.z-o.z,m=o.r+PRAD,d2=dx*dx+dz*dz;if(d2<m*m){const d=Math.sqrt(d2)||1e-4;p.x+=dx/d*(m-d);p.z+=dz/d*(m-d)}}}}

const t=b==='mountain'?'gold':b==='desert'?'oil':b==='water'?(Math.random()<.5?'gold':'oil'):(b==='forest'&&Math.random()<.15?'gold':null);if(!t)continue;
const m=new THREE.Mesh(t==='gold'?gm:om,new THREE.MeshLambertMaterial({color:t==='gold'?0xffc400:0x151515,emissive:t==='gold'?0x553b00:0x111111}));m.position.set(x,Math.max(h,0)+1.2,z);m.visible=false;scene.add(m);

else{const sh=new THREE.Mesh(new THREE.BoxGeometry(2.6,2,2.6),mat(0x7a5230)),rf=new THREE.Mesh(new THREE.ConeGeometry(2.2,1.3,4),mat(0x3b2a1a)),dr=new THREE.Mesh(new THREE.BoxGeometry(.9,1.3,.1),mat(0x111111));sh.position.y=1;rf.position.y=2.65;rf.rotation.y=Math.PI/4;dr.position.set(0,.65,1.31);G.add(sh,rf,dr)}}
